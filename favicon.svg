<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>

  <!-- Subtle Top Highlight Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Team / Personnel Icon Vector -->
  <g fill="#ffffff" filter="url(#subtleGlow)">
    <!-- Left Person -->
    <circle cx="20" cy="27" r="5.5" opacity="0.85"/>
    <path d="M10 46 C10 39 16 36 22 36 C24.5 36 26.8 36.8 28.5 38.2 C26.7 40.2 25.5 42.8 25.5 46 Z" opacity="0.85"/>

    <!-- Right Person -->
    <circle cx="44" cy="27" r="5.5" opacity="0.85"/>
    <path d="M54 46 C54 39 48 36 42 36 C39.5 36 37.2 36.8 35.5 38.2 C37.3 40.2 38.5 42.8 38.5 46 Z" opacity="0.85"/>

    <!-- Center Leader Person -->
    <circle cx="32" cy="22" r="7.5"/>
    <path d="M19 46 C19 37.5 25 34 32 34 C39 34 45 37.5 45 46 Z"/>
  </g>
</svg>
